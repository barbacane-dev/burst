name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  # ── Build release binaries ─────────────────────────────────────────────────
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: burst-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: burst-linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: burst-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (Linux cross-compilation)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          SQLX_OFFLINE: "true"
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/burst ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ── Docker image (multi-arch) ──────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare binaries for Docker build
        run: |
          mkdir -p bin/amd64 bin/arm64
          cp artifacts/burst-linux-amd64/burst-linux-amd64 bin/amd64/burst
          cp artifacts/burst-linux-arm64/burst-linux-arm64 bin/arm64/burst
          chmod +x bin/amd64/burst bin/arm64/burst

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to custom registry
        if: env.CUSTOM_REGISTRY != ''
        continue-on-error: true
        id: custom-login
        env:
          CUSTOM_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        env:
          CUSTOM_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          CUSTOM_IMAGE: ${{ secrets.DOCKER_IMAGE_NAME }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS="ghcr.io/${{ github.repository }}:${VERSION}"
          TAGS="${TAGS},ghcr.io/${{ github.repository }}:latest"
          if [ "${{ steps.custom-login.outcome }}" = "success" ] && [ -n "${CUSTOM_REGISTRY}" ] && [ -n "${CUSTOM_IMAGE}" ]; then
            TAGS="${TAGS},${CUSTOM_REGISTRY}/${CUSTOM_IMAGE}:${VERSION}"
            TAGS="${TAGS},${CUSTOM_REGISTRY}/${CUSTOM_IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push (API server)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Compute nginx image tags
        id: nginx-tags
        env:
          CUSTOM_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          CUSTOM_IMAGE: ${{ secrets.DOCKER_IMAGE_NAME }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS="ghcr.io/${{ github.repository }}-nginx:${VERSION}"
          TAGS="${TAGS},ghcr.io/${{ github.repository }}-nginx:latest"
          if [ "${{ steps.custom-login.outcome }}" = "success" ] && [ -n "${CUSTOM_REGISTRY}" ] && [ -n "${CUSTOM_IMAGE}" ]; then
            TAGS="${TAGS},${CUSTOM_REGISTRY}/${CUSTOM_IMAGE}-nginx:${VERSION}"
            TAGS="${TAGS},${CUSTOM_REGISTRY}/${CUSTOM_IMAGE}-nginx:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push (nginx frontend)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.nginx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.nginx-tags.outputs.tags }}

      - name: Compute all-in-one image tags
        id: aio-tags
        env:
          CUSTOM_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          CUSTOM_IMAGE: ${{ secrets.DOCKER_IMAGE_NAME }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS="ghcr.io/${{ github.repository }}-aio:${VERSION}"
          TAGS="${TAGS},ghcr.io/${{ github.repository }}-aio:latest"
          if [ "${{ steps.custom-login.outcome }}" = "success" ] && [ -n "${CUSTOM_REGISTRY}" ] && [ -n "${CUSTOM_IMAGE}" ]; then
            TAGS="${TAGS},${CUSTOM_REGISTRY}/${CUSTOM_IMAGE}-aio:${VERSION}"
            TAGS="${TAGS},${CUSTOM_REGISTRY}/${CUSTOM_IMAGE}-aio:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push (all-in-one)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.all-in-one
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.aio-tags.outputs.tags }}

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/burst-linux-amd64/burst-linux-amd64
            artifacts/burst-linux-arm64/burst-linux-arm64
            artifacts/burst-macos-arm64/burst-macos-arm64
