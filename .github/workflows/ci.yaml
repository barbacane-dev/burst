name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'crates/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yaml'
            smoke:
              - 'crates/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'specs/**'
              - 'barbacane.yaml'
              - 'burst.toml'
              - 'tests/http/**'
              - 'docker/**'
              - 'Dockerfile'
              - '.github/workflows/ci.yaml'

  fmt:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  unit-tests:
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p burst-core

  db-tests:
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: burst
          POSTGRES_PASSWORD: burst
          POSTGRES_DB: burst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U burst"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://burst:burst@localhost:5432/burst
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p burst-server

  audit:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    continue-on-error: true
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071

  smoke:
    runs-on: ubuntu-latest
    needs: [changes, db-tests]
    if: >-
      always() &&
      needs.changes.outputs.smoke == 'true' &&
      !contains(needs.*.result, 'failure')
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: burst
          POSTGRES_PASSWORD: burst
          POSTGRES_DB: burst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U burst"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mock-oauth:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        ports:
          - 9099:8080
        env:
          SERVER_PORT: "8080"
          JSON_CONFIG: >
            {
              "interactiveLogin": false,
              "tokenCallbacks": [
                {
                  "issuerId": "burst",
                  "tokenExpiry": 3600,
                  "requestMappings": [
                    {
                      "requestParam": "username",
                      "match": "alice",
                      "claims": { "aud": "burst", "roles": ["admin"] }
                    },
                    {
                      "requestParam": "grant_type",
                      "match": "password",
                      "claims": { "aud": "burst", "roles": ["member"] }
                    }
                  ]
                }
              ]
            }
    env:
      DATABASE_URL: postgres://burst:burst@localhost:5432/burst
      BARBACANE_VERSION: "0.5.1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Burst
        run: cargo build --release

      - name: Seed database
        run: cargo run --release --example seed -- "$DATABASE_URL"

      - name: Install Barbacane gateway
        run: |
          mkdir -p .barbacane/bin
          curl -fSL -o .barbacane/bin/barbacane \
            "https://github.com/barbacane-dev/barbacane/releases/download/v${BARBACANE_VERSION}/barbacane-x86_64-unknown-linux-gnu"
          chmod +x .barbacane/bin/barbacane

      - name: Compile gateway artifact
        run: make gateway-compile

      - name: Write burst.toml for CI
        run: |
          cat > burst.toml <<'TOML'
          [server]
          listen = "0.0.0.0:3000"
          admin_listen = "0.0.0.0:3001"

          [database]
          url = "postgres://burst:burst@localhost:5432/burst"
          max_connections = 5
          TOML

      - name: Start Burst server
        run: |
          RUST_LOG=info ./target/release/burst burst.toml > /tmp/burst.log 2>&1 &
          echo $! > /tmp/burst.pid
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/channels 2>/dev/null) || true
            [ "$code" != "000" ] && echo "Burst server ready (HTTP $code)" && break
            sleep 1
          done
          if [ "$code" = "000" ]; then
            echo "::error::Burst server failed to start"
            cat /tmp/burst.log
            exit 1
          fi

      - name: Start Barbacane gateway
        env:
          # Upstream URLs (localhost in CI — Burst runs on the same host)
          BURST_UPSTREAM_URL: http://127.0.0.1:3000
          BURST_UPSTREAM_WS_URL: ws://127.0.0.1:3000
          # OIDC (mock OAuth on the same host)
          BURST_OIDC_ISSUER_URL: http://127.0.0.1:9099/burst
          BURST_OIDC_ISSUER_OVERRIDE: http://localhost:9099/burst
          # Dummy S3 env vars so Barbacane resolves env:// references in the spec.
          # The S3 routes are not exercised in the standard smoke test.
          BURST_S3_REGION: us-east-1
          BURST_S3_BUCKET: burst-ci
          BURST_S3_ACCESS_KEY_ID: ci-key
          BURST_S3_SECRET_ACCESS_KEY: ci-secret
          BURST_S3_ENDPOINT: http://localhost:9000
        run: |
          .barbacane/bin/barbacane serve \
            --artifact burst-api.bca \
            --listen 0.0.0.0:8080 \
            --dev \
            --allow-plaintext-upstream \
            --max-body-size 10485760 > /tmp/barbacane.log 2>&1 &
          echo $! > /tmp/barbacane.pid
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/channels 2>/dev/null) || true
            [ "$code" != "000" ] && echo "Barbacane gateway ready (HTTP $code)" && break
            sleep 1
          done
          if [ "$code" = "000" ]; then
            echo "::error::Barbacane gateway failed to start"
            cat /tmp/barbacane.log
            exit 1
          fi

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz \
            | tar xzf - --strip-components=1
          sudo mv k6 /usr/local/bin/

      - name: Run smoke tests
        run: k6 run tests/http/smoke.js

  openapi-lint:
    runs-on: ubuntu-latest
    # Always lint — not just when specs/ changes. Catches spec regressions introduced by any commit.
    steps:
      - uses: actions/checkout@v4
      - name: Download Barbacane ruleset and functions
        run: |
          mkdir -p .barbacane/rulesets
          curl -fsSL "https://docs.barbacane.dev/rulesets/barbacane.yaml" \
            -o ".barbacane/rulesets/barbacane.yaml"
          for f in barbacane-auth-opt-out barbacane-no-duplicate-middlewares \
                   barbacane-no-plaintext-upstream barbacane-no-unknown-extensions \
                   barbacane-valid-path-params barbacane-valid-secret-refs \
                   barbacane-validate-dispatch-config barbacane-validate-middleware-config; do
            curl -fsSL "https://docs.barbacane.dev/rulesets/functions/${f}.js" \
              -o "specs/functions/${f}.js"
          done
      - name: Lint OpenAPI spec with vacuum
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work:ro \
            dshanley/vacuum:latest lint \
            --functions /work/specs/functions \
            --ruleset /work/specs/.vacuum.yaml \
            --fail-severity error \
            /work/specs/burst-api.yaml
