# Burst OpenAPI Ruleset (ADR-005)
#
# Extends Vacuum's recommended OAS rules, OWASP rules, and Barbacane's
# gateway-specific rules, with Burst-specific conventions layered on top.
#
# Custom functions must be loaded with:
#   vacuum lint -f .barbacane/rulesets/functions specs/burst-api.yaml -r specs/.vacuum.yaml

extends:
  - - "vacuum:oas"
    - "recommended"
  - - "vacuum:owasp"
    - "all"
  - - ".barbacane/rulesets/barbacane.yaml"
    - "recommended"

rules:

  # ── ADR-005: Path conventions ──

  # Paths must use kebab-case (no uppercase or underscores in literal path segments)
  # Allows camelCase inside {param} placeholders per ADR-005 naming conventions
  burst-paths-kebab-case:
    description: "Path segments must use kebab-case (ADR-005)"
    severity: error
    given: $.paths
    then:
      function: pattern
      functionOptions:
        notMatch: "/[a-z0-9-]+[A-Z_]|/[A-Z_]"

  # No trailing slashes
  burst-path-no-trailing-slash:
    description: "Paths must not have trailing slashes (ADR-005)"
    severity: error
    given: $.paths
    then:
      function: pattern
      functionOptions:
        notMatch: "/$"

  # ── ADR-005: Naming conventions ──

  # Schema component names must be UpperCamelCase
  burst-schema-names-pascal-case:
    description: "Schema names must be UpperCamelCase (ADR-005)"
    severity: error
    given: $.components.schemas
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][a-zA-Z0-9]*$"

  # Request/response body field names must be camelCase
  burst-properties-camel-case:
    description: "Schema property names must be camelCase (ADR-005)"
    severity: error
    given: $.components.schemas[*].properties
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][a-zA-Z0-9]*$"

  # ── ADR-005: Spec format ──

  # Must use OpenAPI 3.2+ (ADR-005 requires 3.2.x)
  burst-openapi-version:
    description: "Must use OpenAPI 3.2.x (ADR-005)"
    severity: error
    given: $
    then:
      field: openapi
      function: pattern
      functionOptions:
        match: "^3\\.2\\."

  # Tags must be defined in global tags array
  burst-global-tags:
    description: "Tags must be defined in global tags array (ADR-005)"
    severity: error
    given: $
    then:
      field: tags
      function: truthy

  # ── OWASP rule adjustments ──
  #
  # Burst runs behind Barbacane gateway which handles: rate limiting, auth
  # enforcement, and global security policies (ADR-006, ADR-009). Rules that
  # mandate those concerns in the spec itself are demoted to warn.

  # Rate limiting: Barbacane rate-limit middleware injects headers and 429s at gateway level.
  # Response headers and 429 codes are declared in the spec to match runtime behaviour.
  owasp-rate-limit: warn
  owasp-rate-limit-retry-after: warn
  owasp-define-error-responses-429: warn

  # 401 responses: Barbacane jwt-auth middleware handles globally (ADR-006)
  owasp-define-error-responses-401: warn

  # Auth endpoints (login, refresh, logout) are intentionally public
  owasp-protection-global-unsafe: warn
  owasp-protection-global-unsafe-strict: warn

  # Integer bounds (counts, pagination limits): conceptually unbounded, validated in code
  owasp-integer-limit: warn

  # String format restrictions on identifiers already use patterns; emoji is unconstrained by design
  owasp-string-restricted: warn

  # 422 validation error responses: worth adding eventually, not a blocker
  owasp-define-error-validation: warn

  # Examples are nice-to-have, not blocking
  oas3-missing-example: warn

  # ── Barbacane ruleset adjustments ──
  #
  # Dev server URLs use plaintext HTTP/WS (localhost); HTTPS/WSS in prod
  barbacane-no-plaintext-upstream: warn
