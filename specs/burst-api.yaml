        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
        - name: emoji
          in: path
          required: true
          description: Emoji character or shortcode
          schema:
            type: string
            pattern: "^.+$"
            minLength: 1
            maxLength: 64
            example: "👍"
      responses:
        "204":
          description: Reaction added
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "404":
          $ref: "#/components/responses/MessageNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeReaction
      summary: Remove a reaction from a message
      description: Removes the current user's emoji reaction from a message.
