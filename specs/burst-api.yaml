          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: unpinMessage
      summary: Unpin a message
      description: Removes a pin from a message in the channel.
      tags:
        - Pins
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Message unpinned
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Pin not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

        "429":
          $ref: "#/components/responses/RateLimited"
  /channels/{channelId}/pins:
    get:
      operationId: listPins
      summary: List pinned messages
      description: Returns all pinned messages for a channel, ordered by pin time.
      tags:
        - Pins
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: List of pinned messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

        "429":
          $ref: "#/components/responses/RateLimited"
  # ── Channel archival ──

  /channels/{channelId}/archive:
    post:
      operationId: archiveChannel
      summary: Archive a channel
      description: >-
        Archives a channel, making it read-only. Requires admin role or
        channel ownership.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Channel archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden — not admin or channel owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

        "429":
          $ref: "#/components/responses/RateLimited"
  /channels/{channelId}/unarchive:
    post:
      operationId: unarchiveChannel
      summary: Unarchive a channel
      description: Restores an archived channel to normal read-write mode.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Channel unarchived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

        "429":
          $ref: "#/components/responses/RateLimited"
  # ── Notification preferences ──

  /channels/{channelId}/members/me/notify:
    patch:
      operationId: updateNotifyPreference
      summary: Update notification preference
      description: >-
        Sets the per-channel notification preference for the current user.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notify:
                  type: string
                  enum: [all, mentions, nothing]
                  description: Notification level for this channel
              required:
                - notify
      responses:
        "204":
          description: Preference updated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

        "429":
          $ref: "#/components/responses/RateLimited"
  # ── Admin endpoints ──

  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List all users (admin)
      description: >-
        Returns a paginated list of all users including deactivated ones.
