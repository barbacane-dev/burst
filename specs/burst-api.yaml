openapi: 3.2.0
info:
  title: Burst API
  version: 0.1.0
  description: >-
    Burst team messaging API. This spec is the single source of truth for both
    the API contract and the Barbacane gateway configuration (ADR-005, ADR-006).
  contact:
    name: Barbacane
    url: https://github.com/barbacane-dev/burst
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: https://localhost:8080
    description: Barbacane gateway (local dev)

# ── Barbacane gateway configuration ──

x-barbacane-middlewares:
  - name: jwt-auth
    config:
      secret: "env://BURST_AUTH_JWT_SECRET"
      claims_to_headers:
        - claim: sub
          header: X-Auth-Consumer
        - claim: role
          header: X-Auth-Consumer-Groups
      strip_authorization_header: true

# ── Tags ──

tags:
  - name: Auth
    description: Authentication endpoints for local login and token refresh
  - name: Users
    description: User profile management
  - name: Channels
    description: Channel management and membership
  - name: Messages
    description: Messaging within channels
  - name: Reactions
    description: Emoji reactions on messages

# ── Paths ──

paths:
  /auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      description: Authenticates a local user and returns JWT access and refresh tokens.
      tags:
        - Auth
      security: []
      x-barbacane-middlewares: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      requestBody:
        description: User credentials
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "alice@example.com"
              password: "hunter2"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                accessToken: "eyJhbGciOiJIUzI1NiJ9..."
                tokenType: "Bearer"
                expiresIn: 900
        "400":
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "urn:burst:error:bad-request"
                title: "Bad Request"
                status: 400
                detail: "Missing required field: email"
        "401":
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "urn:burst:error:unauthorized"
                title: "Unauthorized"
                status: 401
                detail: "Missing or invalid authentication"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "urn:burst:error:rate-limited"
                title: "Too Many Requests"
                status: 429
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "urn:burst:error:internal-error"
                title: "Internal Server Error"
                status: 500

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh an access token
      description: >-
        Exchanges a valid refresh token for a new access token. The refresh token
        is read from the `refresh_token` httpOnly cookie set at login; no request
        body is required.
      tags:
        - Auth
      security: []
      x-barbacane-middlewares: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                accessToken: "eyJhbGciOiJIUzI1NiJ9..."
                tokenType: "Bearer"
                expiresIn: 900
        "400":
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Invalid or expired refresh token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/logout:
    post:
      operationId: logout
      summary: Log out and revoke refresh token
      description: Revokes the current refresh token cookie and ends the session.
      tags:
        - Auth
      security: []
      x-barbacane-middlewares: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      responses:
        "204":
          description: Logged out successfully
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /users:
    get:
      operationId: listUsers
      summary: List users
      description: Returns a paginated list of users ordered by creation time.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - name: cursor
          in: query
          description: Pagination cursor (opaque token from previous response)
          schema:
            type: string
            format: uuid
            maxLength: 36
            example: "0193a5e0-7c1a-7000-8000-000000000001"
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 200
            example: 50
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /users/me:
    get:
      operationId: getMe
      summary: Get current user
      description: Returns the profile of the currently authenticated user.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "usr_0193a5e0-7c1a-7000-8000-000000000001"
                username: "alice"
                displayName: "Alice Martin"
                email: "alice@example.com"
                role: "member"
                status: "online"
                isBot: false
                createdAt: "2026-03-06T10:00:00Z"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /users/{userId}:
    get:
      operationId: getUser
      summary: Get a user by ID
      description: Returns the public profile of a specific user.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID (prefixed with usr_ or raw UUID)
          schema:
            type: string
            pattern: "^(usr_)?[0-9a-f-]{36}$"
            maxLength: 40
            example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid user ID format
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /channels:
    get:
      operationId: listChannels
      summary: List channels for current user
      description: Returns channels the authenticated user is a member of, ordered by name.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      responses:
        "200":
          description: Channel list
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      operationId: createChannel
      summary: Create a channel
      description: Creates a new public or private channel. The creator is automatically added as owner.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      requestBody:
        description: Channel to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
            example:
              name: "engineering"
              slug: "engineering"
              kind: "public"
              topic: "Engineering discussions"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Channel slug already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /channels/browse:
    get:
      operationId: browseChannels
      summary: Browse public channels
      description: Returns a paginated list of public channels. No membership required.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - name: cursor
          in: query
          description: Pagination cursor (opaque token from previous response)
          schema:
            type: string
            maxLength: 40
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Paginated public channel list
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/Channel"
                  cursor:
                    type: string
                    maxLength: 40
                    description: Cursor for next page, absent if no more results.
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /channels/{channelId}:
    get:
      operationId: getChannel
      summary: Get a channel
      description: Returns a channel by ID. Private channels require membership.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Channel details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          description: Invalid channel ID format
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Channel not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      operationId: updateChannel
      summary: Update a channel
      description: Updates channel name, topic, or description. Requires membership.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        description: Fields to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Channel not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /dms:
    post:
      operationId: createOrGetDm
      summary: Create or retrieve a direct message channel
      description: Returns an existing DM channel with the given user, or creates one if it does not exist.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      requestBody:
        description: Target user for the DM
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDmRequest"
      responses:
        "200":
          description: DM channel (existing or newly created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Target user not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /channels/{channelId}/members:
    get:
      operationId: listChannelMembers
      summary: List channel members
      description: Returns members of a channel. Requires membership.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Channel member list
          content:
            application/json:
              schema:
                type: array
                maxItems: 10000
                items:
                  $ref: "#/components/schemas/ChannelMember"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      operationId: joinChannel
      summary: Join a channel
      description: Adds the current user to a public channel.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: Joined successfully
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Cannot join non-public channel
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Channel not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /channels/{channelId}/members/me:
    delete:
      operationId: leaveChannel
      summary: Leave a channel
      description: Removes the current user from the channel.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: Left successfully
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /channels/{channelId}/members/me/last-read:
    patch:
      operationId: markChannelRead
      summary: Mark the channel as read
      description: Updates the caller's last-read timestamp for this channel, resetting the unread count.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: Last-read timestamp updated
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Channel not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /channels/{channelId}/messages:
    get:
      operationId: listMessages
      summary: List messages in a channel
      description: Returns messages in a channel ordered by newest first (cursor-based pagination with UUIDv7).
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - name: cursor
          in: query
          description: Pagination cursor (message ID; returns messages older than this)
          schema:
            type: string
            format: uuid
            maxLength: 36
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Paginated message list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      operationId: sendMessage
      summary: Send a message
      description: Sends a new message to a channel. Requires membership.
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        description: Message to send
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            example:
              content: "Hello, world!"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /channels/{channelId}/messages/{messageId}:
    get:
      operationId: getMessage
      summary: Get a message
      description: Returns a specific message by ID. Requires channel membership.
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Message details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Message not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      operationId: editMessage
      summary: Edit a message
      description: Edits a message's content. Only the author can edit their own messages.
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        description: Updated message content
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMessageRequest"
      responses:
        "200":
          description: Message edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Message not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      operationId: deleteMessage
      summary: Delete a message
      description: Soft-deletes a message (content cleared, row preserved). Only the author can delete.
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Message deleted
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Message not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /channels/{channelId}/messages/{messageId}/replies:
    get:
      operationId: listThreadReplies
      summary: List replies in a message thread
      description: Returns replies to a thread root message, ordered by oldest first.
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
        - name: cursor
          in: query
          description: Pagination cursor (message ID)
          schema:
            type: string
            maxLength: 40
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Paginated thread reply list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Message not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /channels/{channelId}/messages/{messageId}/reactions/{emoji}:
    put:
      operationId: addReaction
      summary: Add a reaction to a message (idempotent)
      description: Adds an emoji reaction from the current user. Has no effect if already reacted.
      tags:
        - Reactions
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
        - name: emoji
          in: path
          required: true
          description: Emoji character or shortcode
          schema:
            type: string
            maxLength: 64
            example: "👍"
      responses:
        "204":
          description: Reaction added
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Message not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      operationId: removeReaction
      summary: Remove a reaction from a message
      description: Removes the current user's emoji reaction from a message.
      tags:
        - Reactions
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://localhost:3000"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
        - name: emoji
          in: path
          required: true
          description: Emoji character or shortcode
          schema:
            type: string
            maxLength: 64
            example: "👍"
      responses:
        "204":
          description: Reaction removed
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Message or reaction not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

# ── Components ──

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT access token issued by Burst local auth or an external OIDC provider.
        Validated by Barbacane jwt-auth plugin. This scheme supports RFC8725.

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      description: Channel ID (prefixed with ch_ or raw UUID)
      schema:
        type: string
        pattern: "^(ch_)?[0-9a-f-]{36}$"
        maxLength: 39
        example: "ch_0193a5e0-7c1a-7000-8000-000000000010"
    MessageId:
      name: messageId
      in: path
      required: true
      description: Message ID (prefixed with msg_ or raw UUID)
      schema:
        type: string
        pattern: "^(msg_)?[0-9a-f-]{36}$"
        maxLength: 40
        example: "msg_0193a5e0-7c1a-7000-8000-000000000100"

  schemas:
    LoginRequest:
      type: object
      description: Credentials for local password authentication.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: "alice@example.com"
        password:
          type: string
          format: password
          maxLength: 128
          example: "hunter2"

    TokenResponse:
      type: object
      description: >-
        Access token returned on successful authentication. The refresh token is
        delivered as an httpOnly cookie and is not included in this response body.
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          format: byte
          maxLength: 2048
          description: JWT access token.
          example: "eyJhbGciOiJIUzI1NiJ9..."
        tokenType:
          type: string
          enum:
            - Bearer
          example: "Bearer"
        expiresIn:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
          description: Access token TTL in seconds.
          example: 900

    User:
      type: object
      description: User profile visible to other authenticated users.
      required:
        - id
        - username
        - displayName
        - role
        - status
        - isBot
        - createdAt
      properties:
        id:
          type: string
          pattern: "^usr_[0-9a-f-]{36}$"
          maxLength: 40
          description: Prefixed user ID.
          example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
        username:
          type: string
          pattern: "^[a-zA-Z0-9._-]+$"
          maxLength: 64
          example: "alice"
        displayName:
          type: string
          pattern: "^.+$"
          maxLength: 128
          example: "Alice Martin"
        email:
          type: string
          format: email
          maxLength: 255
          example: "alice@example.com"
        avatarUrl:
          type: string
          format: uri
          maxLength: 2048
        role:
          type: string
          enum:
            - admin
            - moderator
            - member
            - guest
          example: "member"
        status:
          type: string
          enum:
            - online
            - away
            - offline
            - dnd
          example: "online"
        statusText:
          type: string
          pattern: "^.*$"
          maxLength: 256
          example: "In a meeting"
        isBot:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:00:00Z"

    UserList:
      type: object
      description: Paginated list of users with cursor for next page.
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/User"
          example: []
        cursor:
          type: string
          maxLength: 40
          pattern: "^usr_[0-9a-f-]{36}$"
          description: Cursor for next page, absent if no more results.
          example: "usr_0193a5e0-7c1a-7000-8000-000000000002"

    ProblemDetails:
      type: object
      description: RFC 9457 problem details for HTTP APIs.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          maxLength: 128
          description: "Error type URN (e.g., urn:burst:error:not-found)."
          example: "urn:burst:error:not-found"
        title:
          type: string
          pattern: "^.+$"
          maxLength: 128
          description: Short human-readable summary of the problem type.
          example: "Not Found"
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code.
          example: 404
        detail:
          type: string
          pattern: "^.+$"
          maxLength: 1024
          description: Human-readable explanation specific to this occurrence.
          example: "User not found"
        instance:
          type: string
          format: uri
          maxLength: 2048
          description: URI identifying the specific occurrence.
        errors:
          type: array
          maxItems: 100
          description: Validation errors when type is urn:burst:error:validation.
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      description: Individual field validation error within a validation problem.
      required:
        - code
        - message
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_.-]*$"
          maxLength: 64
          description: Machine-readable validation error code.
          example: "required"
        message:
          type: string
          pattern: "^.+$"
          maxLength: 512
          description: Human-readable validation error message.
          example: "Field 'email' is required"
        location:
          type: string
          pattern: "^[a-zA-Z0-9._\\[\\]]+$"
          maxLength: 256
          description: JSONPath or dot-notation location of the invalid field.
          example: "body.email"

    Channel:
      type: object
      description: A messaging channel (public, private, DM, or group DM).
      required:
        - id
        - kind
        - createdBy
        - isArchived
        - isReadonly
        - createdAt
        - updatedAt
        - unreadCount
      properties:
        id:
          type: string
          pattern: "^ch_[0-9a-f-]{36}$"
          maxLength: 39
          description: Prefixed channel ID.
          example: "ch_0193a5e0-7c1a-7000-8000-000000000010"
        kind:
          type: string
          enum:
            - public
            - private
            - dm
            - group_dm
          example: "public"
        name:
          type: string
          pattern: "^.+$"
          maxLength: 128
          example: "engineering"
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          maxLength: 128
          description: URL-friendly channel identifier.
          example: "engineering"
        topic:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 512
          example: "Engineering discussions"
        description:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 2048
          example: "Main channel for the engineering team"
        createdBy:
          type: string
          pattern: "^usr_[0-9a-f-]{36}$"
          maxLength: 40
          example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
        isArchived:
          type: boolean
          example: false
        isReadonly:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:00:00Z"
        unreadCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of unread messages for the current user in this channel.
          example: 3

    CreateChannelRequest:
      type: object
      description: Request body for creating a new channel.
      required:
        - name
      properties:
        name:
          type: string
          pattern: "^.+$"
          maxLength: 128
          example: "engineering"
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          maxLength: 128
          example: "engineering"
        kind:
          type: string
          enum:
            - public
            - private
          default: public
          example: "public"
        topic:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 512
        description:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 2048

    UpdateChannelRequest:
      type: object
      description: Request body for updating a channel.
      properties:
        name:
          type: string
          pattern: "^.+$"
          maxLength: 128
        topic:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 512
        description:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 2048

    ChannelMember:
      type: object
      description: A user's membership in a channel.
      required:
        - userId
        - role
        - joinedAt
      properties:
        userId:
          type: string
          pattern: "^usr_[0-9a-f-]{36}$"
          maxLength: 40
          example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
        role:
          type: string
          enum:
            - owner
            - moderator
            - member
          example: "member"
        joinedAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:00:00Z"

    Message:
      type: object
      description: A message in a channel.
      required:
        - id
        - channelId
        - userId
        - content
        - replyCount
        - reactions
        - createdAt
      properties:
        id:
          type: string
          pattern: "^msg_[0-9a-f-]{36}$"
          maxLength: 40
          description: Prefixed message ID.
          example: "msg_0193a5e0-7c1a-7000-8000-000000000100"
        channelId:
          type: string
          pattern: "^ch_[0-9a-f-]{36}$"
          maxLength: 39
          example: "ch_0193a5e0-7c1a-7000-8000-000000000010"
        userId:
          type: string
          pattern: "^usr_[0-9a-f-]{36}$"
          maxLength: 40
          example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
        threadId:
          type: string
          pattern: "^msg_[0-9a-f-]{36}$"
          maxLength: 40
          description: Thread root message ID. Null for top-level messages.
        content:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 4000
          description: Message text content. Empty string if soft-deleted.
          example: "Hello, world!"
        editedAt:
          type: string
          format: date-time
          maxLength: 30
          description: Set when message has been edited.
        deletedAt:
          type: string
          format: date-time
          maxLength: 30
          description: Set when message has been soft-deleted.
        replyCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of replies in this message's thread.
          example: 0
        reactions:
          type: array
          maxItems: 100
          description: Aggregated emoji reactions on this message.
          items:
            $ref: "#/components/schemas/ReactionCount"
        createdAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:05:00Z"

    MessageList:
      type: object
      description: Paginated list of messages with cursor for next page.
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Message"
        cursor:
          type: string
          maxLength: 40
          pattern: "^msg_[0-9a-f-]{36}$"
          description: Cursor for next page (oldest message ID), absent if no more results.

    SendMessageRequest:
      type: object
      description: Request body for sending a new message.
      required:
        - content
      properties:
        content:
          type: string
          pattern: "^.+$"
          maxLength: 4000
          description: Message text content.
          example: "Hello, world!"
        threadId:
          type: string
          pattern: "^(msg_)?[0-9a-f-]{36}$"
          maxLength: 40
          description: ID of the thread root message. Omit to post a top-level message.
          example: "msg_0193a5e0-7c1a-7000-8000-000000000100"

    EditMessageRequest:
      type: object
      description: Request body for editing a message.
      required:
        - content
      properties:
        content:
          type: string
          pattern: "^.+$"
          maxLength: 4000
          description: Updated message text content.
          example: "Hello, world! (edited)"

    ReactionCount:
      type: object
      description: Aggregated reaction count for a single emoji on a message.
      required:
        - emoji
        - count
        - userIds
      properties:
        emoji:
          type: string
          maxLength: 64
          description: Emoji character or shortcode.
          example: "👍"
        count:
          type: integer
          format: int64
          minimum: 0
          description: Total number of users who reacted with this emoji.
          example: 3
        userIds:
          type: array
          maxItems: 1000
          description: IDs of users who reacted with this emoji.
          items:
            type: string
            pattern: "^usr_[0-9a-f-]{36}$"
            maxLength: 40
          example:
            - "usr_0193a5e0-7c1a-7000-8000-000000000001"

    CreateDmRequest:
      type: object
      description: Request body for creating or retrieving a DM channel.
      required:
        - userId
      properties:
        userId:
          type: string
          pattern: "^(usr_)?[0-9a-f-]{36}$"
          maxLength: 40
          description: ID of the user to open a DM with.
          example: "usr_0193a5e0-7c1a-7000-8000-000000000002"
