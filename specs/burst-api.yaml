openapi: 3.2.0
info:
  title: Burst API
  version: 0.1.0
  description: >-
    Burst team messaging API. This spec is the single source of truth for both
    the API contract and the Barbacane gateway configuration (ADR-005, ADR-006).
  contact:
    name: Barbacane
    url: https://github.com/barbacane-dev/burst
  license:
    name: AGPL-3.0-only

servers:
  - url: https://localhost:8080
    description: Barbacane gateway (local dev)

# ── Barbacane gateway configuration ──

x-barbacane-middlewares:
  - name: oidc-auth
    config:
      issuer_url: "env://BURST_OIDC_ISSUER_URL"
      issuer_override: "env://BURST_OIDC_ISSUER_OVERRIDE"
      audience: "burst"
      groups_claim: "env://BURST_OIDC_GROUPS_CLAIM"
  - name: rate-limit
    config:
      quota: 300
      window: 60
      partition_key: "context:auth.sub"

# ── Tags ──

tags:
  - name: Realtime
    description: WebSocket real-time messaging
  - name: Users
    description: User profile management
  - name: Channels
    description: Channel management and membership
  - name: Messages
    description: Messaging within channels
  - name: Reactions
    description: Emoji reactions on messages
  - name: Search
    description: Full-text message search
  - name: Files
    description: File attachments
  - name: Pins
    description: Pinned messages
  - name: Webhooks
    description: Incoming and outgoing webhook management
  - name: Bots
    description: Bot user account management
  - name: Admin
    description: Administration endpoints (admin role required)
  - name: Frontend
    description: SPA static file serving (no authentication)

# ── Paths ──

paths:
  /ws:
    get:
      operationId: websocket
      summary: WebSocket real-time connection
      description: >-
        Upgrades to a WebSocket connection for real-time events. Authentication
        is handled by Barbacane on the HTTP Upgrade request. The optional
        lastEventId query parameter enables gap-fill on reconnect.
      tags:
        - Realtime
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: ws-upstream
        config:
          url: "env://BURST_UPSTREAM_WS_URL"
      x-barbacane-middlewares:
        - name: oidc-auth
          config:
            issuer_url: "env://BURST_OIDC_ISSUER_URL"
            issuer_override: "env://BURST_OIDC_ISSUER_OVERRIDE"
            audience: "burst"
            allow_query_token: true
            groups_claim: "env://BURST_OIDC_GROUPS_CLAIM"
        - name: rate-limit
          config:
            quota: 300
            window: 60
            partition_key: "context:auth.sub"
      parameters:
        - name: lastEventId
          in: query
          description: >-
            ID of the last event received by the client. If provided, the server
            will replay missed events after the WebSocket connection is established.
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-f-]{36}$"
            maxLength: 36
      responses:
        "101":
          description: Switching Protocols — WebSocket upgrade successful
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users:
    get:
      operationId: listUsers
      summary: List users
      description: Returns a paginated list of users ordered by creation time.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      parameters:
        - name: cursor
          in: query
          description: Pagination cursor (opaque token from previous response)
          schema:
            type: string
            pattern: "^ch_[0-9a-f-]{36}$"
            maxLength: 39
            example: "ch_0193a5e0-7c1a-7000-8000-000000000001"
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: string
            maxLength: 3
            pattern: "^[1-9][0-9]{0,2}$"
            default: "50"
            example: "50"
      responses:
        "200":
          description: Paginated user list
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          description: Invalid query parameters
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me:
    get:
      operationId: getMe
      summary: Get current user
      description: Returns the profile of the currently authenticated user.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      responses:
        "200":
          description: Current user profile
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "usr_0193a5e0-7c1a-7000-8000-000000000001"
                username: "alice"
                displayName: "Alice Martin"
                email: "alice@example.com"
                role: "member"
                status: "online"
                isBot: false
                createdAt: "2026-03-06T10:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: updateMe
      summary: Update current user profile
      description: >-
        Updates the authenticated user's profile fields. Only provided fields
        are updated; omitted fields are left unchanged.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      requestBody:
        description: Profile fields to change.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user profile
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/status:
    put:
      operationId: setMyStatus
      summary: Set my custom status
      description: >-
        Sets the authenticated user's custom status: a text, an emoji, or both,
        shown until `expiresAt` when given. Replaces any previous status and
        sends a `user.status_changed` event to every connected client. Once
        expired, the status is reported as absent.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      requestBody:
        description: The custom status to set, with an optional expiry.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
            example:
              text: "In a meeting"
              emoji: "📅"
              expiresAt: "2026-09-24T15:00:00Z"
      responses:
        "200":
          description: The user with their new status
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: clearMyStatus
      summary: Clear my custom status
      description: >-
        Removes the authenticated user's custom status and sends a
        `user.status_changed` event without a status to every connected client.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      responses:
        "200":
          description: The user without a status
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/do-not-disturb:
    get:
      operationId: getMyDoNotDisturb
      summary: Get my do-not-disturb settings
      description: >-
        Returns the authenticated user's snooze and quiet-hours schedule, and
        when their current quiet period ends if they are quiet now.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      responses:
        "200":
          description: Do-not-disturb settings
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoNotDisturb"
              example:
                snoozeUntil: "2026-09-24T15:00:00+00:00"
                schedule:
                  start: "22:00"
                  end: "07:00"
                  days: ["mon", "tue", "wed", "thu", "fri"]
                  timeZone: "Europe/Paris"
                quietUntil: "2026-09-24T15:00:00+00:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: setMyDoNotDisturb
      summary: Set my do-not-disturb settings
      description: >-
        Replaces the authenticated user's do-not-disturb settings: an omitted
        `snoozeUntil` or `schedule` is cleared, so an empty object turns do not
        disturb off. While quiet, the user receives no `notification.created`
        events; messages still count as unread and mentions are still recorded.
        Sends `user.dnd_changed` to every connected client.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      requestBody:
        description: Do-not-disturb snooze and weekly quiet hours.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDoNotDisturbRequest"
            example:
              schedule:
                start: "22:00"
                end: "07:00"
                days: ["mon", "tue", "wed", "thu", "fri"]
                timeZone: "Europe/Paris"
      responses:
        "200":
          description: The new settings
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoNotDisturb"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/{userId}:
    get:
      operationId: getUser
      summary: Get a user by ID
      description: Returns the public profile of a specific user.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID (prefixed with usr_ or raw UUID)
          schema:
            type: string
            pattern: "^(usr_)?[0-9a-f-]{36}$"
            maxLength: 40
            example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
      responses:
        "200":
          description: User profile
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid user ID format
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/channels:
    get:
      operationId: listChannels
      summary: List channels
      description: >-
        Returns a paginated list of channels.

        - `?joined=true` — channels the authenticated user is a member of,
          with per-channel `unreadCount`. Use this for the sidebar.
        - `?joined=false` (default) — all public channels, for discovery.
          `unreadCount` is always `0` in this mode. Empty for a guest, who
          finds channels only by being added to them.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      parameters:
        - name: joined
          in: query
          description: When true, restrict results to channels the caller has joined.
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
        - name: cursor
          in: query
          description: Pagination cursor (opaque token from previous response)
          schema:
            type: string
            pattern: "^ch_[0-9a-f-]{36}$"
            maxLength: 40
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: string
            maxLength: 3
            pattern: "^[1-9][0-9]{0,2}$"
            default: "50"
      responses:
        "200":
          description: Paginated channel list
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/Channel"
                  cursor:
                    type: string
                    pattern: "^ch_[0-9a-f-]{36}$"
                    maxLength: 40
                    description: Cursor for next page, absent if no more results.
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createChannel
      summary: Create a channel
      description: Creates a new public or private channel. The creator is automatically added as owner. Guests cannot create channels.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      requestBody:
        description: Channel to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
            example:
              name: "engineering"
              slug: "engineering"
              kind: "public"
              topic: "Engineering discussions"
      responses:
        "201":
          description: Channel created
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Channel slug already exists
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/channels/{channelId}:
    get:
      operationId: getChannel
      summary: Get a channel
      description: Returns a channel by ID. Private channels require membership, and so do public ones for a guest. A channel the caller may not see is reported as not found.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Channel details
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          description: Invalid channel ID format
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ChannelNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateChannel
      summary: Update a channel
      description: Updates channel name, topic, or description. Requires membership; guests cannot.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        description: Fields to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: Channel updated
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "404":
          $ref: "#/components/responses/ChannelNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/dms:
    post:
      operationId: createOrGetDm
      summary: Create or retrieve a direct message channel
      description: Returns an existing DM channel with the given user, or creates one if it does not exist. Guests cannot start one; they take part in those others start with them.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      requestBody:
        description: Target user for the DM
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDmRequest"
      responses:
        "200":
          description: DM channel (existing or newly created)
          headers:
            X-RateLimit-Limit:
