          body: ""
          headers:
            Location: /index.html
          content_type: text/plain
      x-barbacane-middlewares: []
      responses:
        "302":
          description: Redirect to SPA

  /{path+}:
    get:
      operationId: serveSpa
      summary: Serve SPA static files from S3 with index.html fallback
      tags:
        - Frontend
      x-barbacane-dispatch:
        name: s3
        config:
          region: "env://BURST_S3_REGION"
          bucket: "env://BURST_SPA_BUCKET"
          access_key_id: "env://BURST_S3_ACCESS_KEY_ID"
          secret_access_key: "env://BURST_S3_SECRET_ACCESS_KEY"
          endpoint: "env://BURST_S3_ENDPOINT"
          force_path_style: true
          key_param: path
          fallback_key: index.html
      x-barbacane-middlewares: []
      parameters:
        - name: path
          in: path
          required: true
          allowReserved: true
          schema:
            type: string
            maxLength: 1024
      responses:
        "200":
          description: Static file or SPA fallback
        "404":
          description: File not found (fallback also missing)

# ── Components ──

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT validated by the Barbacane oidc-auth middleware (RFC8725 best
        practices enforced) which sets the X-Auth-Consumer header (sub claim)
        before forwarding to Burst. In local dev, tokens are issued by a mock
        OIDC server (localhost:9099).

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      description: Channel ID (prefixed with ch_ or raw UUID)
      schema:
        type: string
        pattern: "^(ch_)?[0-9a-f-]{36}$"
        maxLength: 39
        example: "ch_0193a5e0-7c1a-7000-8000-000000000010"
    MessageId:
      name: messageId
      in: path
      required: true
      description: Message ID (prefixed with msg_ or raw UUID)
      schema:
        type: string
        pattern: "^(msg_)?[0-9a-f-]{36}$"
        maxLength: 40
        example: "msg_0193a5e0-7c1a-7000-8000-000000000100"
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: Webhook ID (prefixed with wh_ or raw UUID)
      schema:
        type: string
        pattern: "^(wh_)?[0-9a-f-]{36}$"
        maxLength: 39
        example: "wh_0193a5e0-7c1a-7000-8000-000000000200"

  responses:
    Unauthorized:
      description: Missing or invalid authentication
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Policy:
          $ref: "#/components/headers/X-RateLimit-Policy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RateLimited:
      description: Rate limited
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Policy:
          $ref: "#/components/headers/X-RateLimit-Policy"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Resource not found
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Policy:
          $ref: "#/components/headers/X-RateLimit-Policy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalError:
      description: Internal server error
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Policy:
          $ref: "#/components/headers/X-RateLimit-Policy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotChannelMember:
      description: Not a channel member
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Policy:
          $ref: "#/components/headers/X-RateLimit-Policy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    ChannelNotFound:
      description: Channel not found
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Policy:
          $ref: "#/components/headers/X-RateLimit-Policy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    Forbidden:
      description: Forbidden
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Policy:
          $ref: "#/components/headers/X-RateLimit-Policy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    MalformedRequest:
      description: Malformed request
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Policy:
          $ref: "#/components/headers/X-RateLimit-Policy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    MessageNotFound:
      description: Message not found
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Policy:
          $ref: "#/components/headers/X-RateLimit-Policy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    UserNotFound:
      description: User not found
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Policy:
          $ref: "#/components/headers/X-RateLimit-Policy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  headers:
    X-RateLimit-Limit:
      description: Maximum requests allowed in the current window.
      schema:
        type: integer
        format: int32
        example: 100
    X-RateLimit-Remaining:
      description: Remaining requests in the current window.
      schema:
        type: integer
        format: int32
        example: 87
    X-RateLimit-Reset:
      description: Unix timestamp when the current window resets.
      schema:
        type: integer
        format: int64
        example: 1741200000
    X-RateLimit-Policy:
      description: Policy name and settings (IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 100
        example: "100;w=60"
    Retry-After:
      description: Seconds until the next request will be accepted.
      schema:
        type: integer
        format: int32
        example: 12

  schemas:
    User:
      type: object
      description: User profile visible to other authenticated users.
      required:
        - id
        - username
        - displayName
        - role
        - status
        - isBot
        - createdAt
      properties:
        id:
          type: string
          pattern: "^usr_[0-9a-f-]{36}$"
          maxLength: 40
          description: Prefixed user ID.
          example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
        username:
          type: string
          pattern: "^[a-zA-Z0-9._-]+$"
          maxLength: 64
          example: "alice"
        displayName:
          type: string
          pattern: "^[^\\x00-\\x1f]+$"
          maxLength: 128
          example: "Alice Martin"
        email:
          type: string
          format: email
          maxLength: 255
          example: "alice@example.com"
        avatarUrl:
          type: string
          format: uri
          maxLength: 2048
        role:
          type: string
          enum:
            - admin
            - integrator
            - moderator
            - member
            - guest
          example: "member"
        status:
          type: string
          enum:
            - online
            - away
            - offline
            - dnd
          example: "online"
        statusText:
          type: string
          pattern: "^.*$"
          maxLength: 256
          example: "In a meeting"
        isBot:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:00:00Z"

    UserList:
      type: object
      description: Paginated list of users with cursor for next page.
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/User"
          example: []
        cursor:
          type: string
          maxLength: 40
          pattern: "^usr_[0-9a-f-]{36}$"
          description: Cursor for next page, absent if no more results.
          example: "usr_0193a5e0-7c1a-7000-8000-000000000002"

    ProblemDetails:
      type: object
      description: RFC 9457 problem details for HTTP APIs.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          maxLength: 128
          description: "Error type URN (e.g., urn:burst:error:not-found)."
          example: "urn:burst:error:not-found"
        title:
          type: string
          pattern: "^.+$"
          maxLength: 128
          description: Short human-readable summary of the problem type.
          example: "Not Found"
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code.
          example: 404
        detail:
          type: string
          pattern: "^.+$"
          maxLength: 1024
          description: Human-readable explanation specific to this occurrence.
          example: "User not found"
        instance:
          type: string
          format: uri
          maxLength: 2048
          description: URI identifying the specific occurrence.
        errors:
          type: array
          maxItems: 100
          description: Validation errors when type is urn:burst:error:validation.
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      description: Individual field validation error within a validation problem.
      required:
        - code
        - message
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_.-]*$"
          maxLength: 64
          description: Machine-readable validation error code.
          example: "required"
        message:
          type: string
          pattern: "^.+$"
          maxLength: 512
          description: Human-readable validation error message.
          example: "Field 'email' is required"
        location:
          type: string
          pattern: "^[a-zA-Z0-9._\\[\\]]+$"
          maxLength: 256
          description: JSONPath or dot-notation location of the invalid field.
          example: "body.email"

    Channel:
      type: object
      description: A messaging channel (public, private, DM, or group DM).
      required:
        - id
        - kind
        - createdBy
        - isArchived
        - isReadonly
        - createdAt
        - updatedAt
        - unreadCount
      properties:
        id:
          type: string
          pattern: "^ch_[0-9a-f-]{36}$"
          maxLength: 39
          description: Prefixed channel ID.
          example: "ch_0193a5e0-7c1a-7000-8000-000000000010"
        kind:
          type: string
          enum:
            - public
            - private
            - dm
            - group_dm
          example: "public"
        name:
          type: string
          pattern: "^.+$"
          maxLength: 128
          example: "engineering"
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          maxLength: 128
          description: URL-friendly channel identifier.
          example: "engineering"
        topic:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 512
          example: "Engineering discussions"
        description:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 2048
          example: "Main channel for the engineering team"
        createdBy:
          type: string
          pattern: "^usr_[0-9a-f-]{36}$"
          maxLength: 40
          example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
        isArchived:
          type: boolean
          example: false
        isReadonly:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:00:00Z"
        unreadCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of unread messages for the current user in this channel.
          example: 3

    CreateChannelRequest:
      type: object
      description: Request body for creating a new channel.
      required:
        - name
      properties:
        name:
          type: string
          pattern: "^.+$"
          maxLength: 128
          example: "engineering"
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          maxLength: 128
          example: "engineering"
        kind:
          type: string
          enum:
            - public
            - private
          default: public
          example: "public"
        topic:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 512
        description:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 2048

    UpdateChannelRequest:
      type: object
      description: Request body for updating a channel.
      properties:
        name:
          type: string
          pattern: "^.+$"
          maxLength: 128
        topic:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 512
        description:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 2048

    ChannelMember:
      type: object
      description: A user's membership in a channel.
      required:
        - userId
        - role
        - joinedAt
      properties:
        userId:
          type: string
          pattern: "^usr_[0-9a-f-]{36}$"
          maxLength: 40
          example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
        role:
          type: string
          enum:
            - owner
            - moderator
            - member
          example: "member"
        joinedAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:00:00Z"

    Message:
      type: object
      description: A message in a channel.
      required:
        - id
        - channelId
        - userId
        - content
        - replyCount
        - reactions
        - attachments
        - createdAt
      properties:
        id:
          type: string
          pattern: "^msg_[0-9a-f-]{36}$"
          maxLength: 40
          description: Prefixed message ID.
          example: "msg_0193a5e0-7c1a-7000-8000-000000000100"
        channelId:
          type: string
          pattern: "^ch_[0-9a-f-]{36}$"
          maxLength: 39
          example: "ch_0193a5e0-7c1a-7000-8000-000000000010"
        userId:
          type: string
          pattern: "^usr_[0-9a-f-]{36}$"
          maxLength: 40
          example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
        threadId:
          type: string
          pattern: "^msg_[0-9a-f-]{36}$"
          maxLength: 40
          description: Thread root message ID. Null for top-level messages.
        content:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 4000
          description: Message text content. Empty string if soft-deleted.
          example: "Hello, world!"
        editedAt:
          type: string
          format: date-time
          maxLength: 30
          description: Set when message has been edited.
        deletedAt:
          type: string
          format: date-time
          maxLength: 30
          description: Set when message has been soft-deleted.
        replyCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of replies in this message's thread.
          example: 0
        reactions:
          type: array
          maxItems: 100
          description: Aggregated emoji reactions on this message.
          items:
            $ref: "#/components/schemas/ReactionCount"
        attachments:
          type: array
          maxItems: 10
          description: File attachments on this message.
          items:
            $ref: "#/components/schemas/Attachment"
        createdAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:05:00Z"

    MessageList:
      type: object
      description: Paginated list of messages with cursor for next page.
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Message"
        cursor:
          type: string
          maxLength: 40
          pattern: "^msg_[0-9a-f-]{36}$"
          description: Cursor for next page (oldest message ID), absent if no more results.

    ChannelMemberList:
      type: object
      description: List of channel members.
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/ChannelMember"
        cursor:
          type: string
          maxLength: 40
          description: Cursor for next page, absent if no more results.

    CustomEmoji:
      type: object
      required: [id, shortcode, imageUrl, createdBy, createdAt]
      properties:
        id:
          type: string
          maxLength: 40
          description: Emoji unique identifier.
        shortcode:
          type: string
          maxLength: 64
          description: Shortcode used to insert the emoji (e.g. "party_parrot").
        imageUrl:
          type: string
          maxLength: 2048
          format: uri
          description: URL to the emoji image.
        createdBy:
          type: string
          maxLength: 40
          description: User ID of the emoji creator.
        createdAt:
          type: string
          maxLength: 40
          format: date-time

    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          pattern: "^[^\\x00-\\x1f]+$"
          maxLength: 128
          description: Display name shown in messages and sidebar.
        email:
          type: string
          format: email
          maxLength: 320
          description: Email address.
        statusText:
          type: string
          maxLength: 128
          description: Short status text (e.g. "On vacation").

    SendMessageRequest:
      type: object
      description: Request body for sending a new message.
      required:
        - content
      properties:
        content:
          type: string
          pattern: "^.+$"
          maxLength: 4000
          description: Message text content.
          example: "Hello, world!"
        threadId:
          type: string
          pattern: "^(msg_)?[0-9a-f-]{36}$"
          maxLength: 40
          description: ID of the thread root message. Omit to post a top-level message.
          example: "msg_0193a5e0-7c1a-7000-8000-000000000100"

    SendMessageMultipart:
      type: object
      description: Multipart form for sending a message with file attachments.
      required:
        - content
      properties:
        content:
          type: string
          pattern: "^.+$"
          maxLength: 4000
          description: Message text content.
        threadId:
          type: string
          maxLength: 40
          description: ID of the thread root message.
        files:
          type: array
          items:
            type: string
            format: binary
            maxLength: 10485760
          maxItems: 10
          description: File attachments (max 10 files, 10 MB each).

    EditMessageRequest:
      type: object
      description: Request body for editing a message.
      required:
        - content
      properties:
        content:
          type: string
          pattern: "^.+$"
          maxLength: 4000
          description: Updated message text content.
          example: "Hello, world! (edited)"

    ReactionCount:
      type: object
      description: Aggregated reaction count for a single emoji on a message.
      required:
        - emoji
        - count
        - userIds
      properties:
        emoji:
          type: string
          maxLength: 64
          description: Emoji character or shortcode.
          example: "👍"
        count:
          type: integer
          format: int64
          minimum: 0
          description: Total number of users who reacted with this emoji.
          example: 3
        userIds:
          type: array
          maxItems: 1000
          description: IDs of users who reacted with this emoji.
          items:
            type: string
            pattern: "^usr_[0-9a-f-]{36}$"
            maxLength: 40
          example:
            - "usr_0193a5e0-7c1a-7000-8000-000000000001"

    CreateDmRequest:
      type: object
      description: Request body for creating or retrieving a DM channel.
      required:
        - userId
      properties:
        userId:
          type: string
          pattern: "^(usr_)?[0-9a-f-]{36}$"
          maxLength: 40
          description: ID of the user to open a DM with.
          example: "usr_0193a5e0-7c1a-7000-8000-000000000002"

    SearchResult:
      type: object
      description: A message matching a full-text search query.
      required:
        - id
        - channelId
        - userId
        - content
        - headline
        - createdAt
      properties:
        id:
          type: string
          pattern: "^msg_[0-9a-f-]{36}$"
          maxLength: 40
          description: Prefixed message ID.
          example: "msg_0193a5e0-7c1a-7000-8000-000000000100"
        channelId:
          type: string
          pattern: "^ch_[0-9a-f-]{36}$"
          maxLength: 39
          example: "ch_0193a5e0-7c1a-7000-8000-000000000010"
        userId:
          type: string
          pattern: "^usr_[0-9a-f-]{36}$"
          maxLength: 40
          example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
        threadId:
          type: string
          pattern: "^msg_[0-9a-f-]{36}$"
          maxLength: 40
          description: Thread root message ID. Absent for top-level messages.
        content:
          type: string
          pattern: "^[\\s\\S]*$"
          maxLength: 4000
          description: Full message content.
          example: "The deploy fix is ready for review"
        headline:
          type: string
          maxLength: 1000
          description: >-
            Highlighted snippet with <mark> tags around matching terms.
            Suitable for rendering in search result UIs.
          example: "The <mark>deploy</mark> <mark>fix</mark> is ready for review"
        createdAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:05:00Z"

    SearchResultList:
      type: object
      description: Paginated list of search results with cursor for next page.
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/SearchResult"
        cursor:
          type: string
          maxLength: 40
          pattern: "^msg_[0-9a-f-]{36}$"
          description: Cursor for next page, absent if no more results.

    Attachment:
      type: object
      description: A file attachment on a message.
      required:
        - id
        - fileName
        - fileSize
        - contentType
        - metadata
        - createdAt
      properties:
        id:
          type: string
          pattern: "^att_[0-9a-f-]{36}$"
          maxLength: 40
          description: Prefixed attachment ID.
          example: "att_0193a5e0-7c1a-7000-8000-000000000200"
        fileName:
          type: string
          maxLength: 255
          description: Original file name.
          example: "screenshot.png"
        fileSize:
          type: integer
          format: int64
          minimum: 0
          description: File size in bytes.
          example: 204800
        contentType:
          type: string
          maxLength: 255
          description: MIME type of the file.
          example: "image/png"
        metadata:
          type: object
          description: Additional metadata (e.g. image width/height).
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          maxLength: 30
          example: "2026-03-06T10:05:00Z"

    # ── Pin & Admin schemas ──

    PinnedMessage:
      description: A message pinned to a channel.
      type: object
      required: [channelId, messageId, pinnedBy, pinnedAt]
      properties:
        channelId:
          type: string
          maxLength: 40
        messageId:
          type: string
          maxLength: 40
        pinnedBy:
          type: string
          maxLength: 40
        pinnedAt:
          type: string
          format: date-time
          maxLength: 30

    AdminUser:
      description: User record as seen by administrators, includes role and deactivation status.
      type: object
      required: [id, username, displayName, role, isBot, createdAt]
      properties:
        id:
          type: string
          maxLength: 40
        username:
          type: string
          maxLength: 100
        displayName:
          type: string
          maxLength: 200
        email:
          type: string
          maxLength: 255
        role:
          type: string
          enum: [admin, integrator, moderator, member, guest]
        isBot:
          type: boolean
        deactivatedAt:
          type: string
          format: date-time
          maxLength: 30
        createdAt:
          type: string
          format: date-time
          maxLength: 30

    AdminUserList:
      description: Cursor-paginated list of admin user records.
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/AdminUser"
        cursor:
          type: string
          maxLength: 40

    AdminChannelList:
      description: Cursor-paginated list of channels for admin management.
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Channel"
        cursor:
          type: string
          maxLength: 40

    AuditLogEntry:
      description: A single audit log record capturing an admin action.
      type: object
      required: [id, action, targetType, targetId, createdAt]
      properties:
        id:
          type: string
          maxLength: 40
        userId:
          type: string
          maxLength: 40
        action:
          type: string
          maxLength: 100
        targetType:
          type: string
          maxLength: 50
        targetId:
          type: string
          maxLength: 40
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          maxLength: 30

    AuditLogList:
      description: Cursor-paginated list of audit log entries.
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        cursor:
          type: string
          maxLength: 40

    # ── Webhook schemas ──

    Webhook:
      type: object
      description: Webhook configuration (token is never included in list responses).
      required:
        - id
        - channelId
        - kind
        - name
        - isActive
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          pattern: "^wh_[0-9a-f-]{36}$"
          maxLength: 39
          example: "wh_0193a5e0-7c1a-7000-8000-000000000200"
        channelId:
          type: string
          pattern: "^ch_[0-9a-f-]{36}$"
          maxLength: 39
        kind:
          type: string
          enum:
            - incoming
            - outgoing
          example: "incoming"
        name:
          type: string
          maxLength: 128
          example: "CI Notifications"
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Target URL for outgoing webhooks.
        isActive:
          type: boolean
          example: true
        createdBy:
          type: string
          pattern: "^usr_[0-9a-f-]{36}$"
          maxLength: 40
        createdAt:
          type: string
          format: date-time
          maxLength: 30

    WebhookList:
      type: object
      description: Cursor-paginated list of webhooks.
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Webhook"
        cursor:
          type: string
          maxLength: 39
          pattern: "^wh_[0-9a-f-]{36}$"

    CreateWebhookRequest:
      type: object
      description: Request body for creating a webhook.
      required:
        - kind
        - name
      properties:
        kind:
          type: string
          enum:
            - incoming
            - outgoing
        name:
          type: string
          minLength: 1
          maxLength: 128
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Required for outgoing webhooks.

    CreateWebhookResponse:
      type: object
      description: Webhook with plaintext token (shown only once).
      required:
        - id
        - channelId
        - kind
        - name
        - isActive
        - createdBy
        - createdAt
        - token
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          properties:
            token:
              type: string
              maxLength: 64
              description: Plaintext token for authentication (shown once).

    UpdateWebhookRequest:
      type: object
      description: Partial update for a webhook.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        url:
          type: string
          format: uri
          maxLength: 2048
        isActive:
          type: boolean

    IncomingWebhookPayload:
      type: object
      description: Payload for triggering an incoming webhook.
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 40000
          description: Message content to post.

    # ── Bot schemas ──

    CreateBotRequest:
      type: object
      description: Request body for creating a bot user.
      required:
        - username
        - displayName
      properties:
        username:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
          minLength: 1
          maxLength: 64
          example: "ci-bot"
        displayName:
          type: string
          minLength: 1
          maxLength: 128
          example: "CI Bot"

    UpdateBotRequest:
      type: object
      description: Partial update for a bot user.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 128

    BotList:
      type: object
      description: List of bot users.
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/AdminUser"
