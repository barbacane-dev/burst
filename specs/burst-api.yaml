      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      x-barbacane-middlewares:
        - name: acl
          config:
            allow:
              - admin
      parameters:
