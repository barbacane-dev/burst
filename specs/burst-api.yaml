  # ── Data Exports (Admin) ──

  /api/admin/exports:
    get:
      operationId: listExports
      summary: List data exports
      description: The 50 most recent exports, newest first.
      tags:
        - Admin
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      x-barbacane-middlewares:
        - name: acl
          config:
            allow:
              - admin
      responses:
        "200":
          description: Exports
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createExport
      summary: Request a data export
      description: >-
        Starts building an archive of messages and files in the background:
        the whole instance (every channel, private channels and direct messages
        included) or one channel. Deleted messages are left out. Poll the export
        until its status is `completed`, then download it. One export runs at a
        time. The request is recorded in the audit log.
      tags:
        - Admin
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      x-barbacane-middlewares:
        - name: acl
          config:
            allow:
              - admin
      requestBody:
        description: What to export.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExportRequest"
            example:
              channelId: "ch_0193a5e0-7c1a-7000-8000-000000000010"
      responses:
        "202":
          description: The export, pending
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another export is in progress
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/exports/{exportId}:
    get:
      operationId: getExport
      summary: Get a data export
      description: >-
        An export's status. One that stopped making progress for ten minutes
        (its server restarted) is reported as failed with the error
        `interrupted`.
      tags:
        - Admin
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      x-barbacane-middlewares:
        - name: acl
          config:
            allow:
              - admin
      parameters:
        - name: exportId
          in: path
          required: true
          description: Prefixed export ID.
          schema:
            type: string
            pattern: "^exp_[0-9a-f-]{36}$"
            maxLength: 40
      responses:
        "200":
          description: The export
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteExport
      summary: Delete a data export
      description: Deletes a finished export and its archive. Recorded in the audit log.
      tags:
        - Admin
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      x-barbacane-middlewares:
        - name: acl
          config:
            allow:
              - admin
      parameters:
        - name: exportId
          in: path
          required: true
          description: Prefixed export ID.
          schema:
            type: string
            pattern: "^exp_[0-9a-f-]{36}$"
            maxLength: 40
      responses:
        "204":
          description: Deleted
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The export is still in progress
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/exports/{exportId}/download:
    get:
      operationId: downloadExport
      summary: Download a data export
      description: >-
        The archive, as a zip: `export.json` (what was exported), `users.json`,
        `channels/<channel id>/channel.json` and `messages.jsonl` (one message
        per line, oldest first), and `files/<attachment id>/<file name>`.
        Recorded in the audit log.
      tags:
        - Admin
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      x-barbacane-middlewares:
        - name: acl
          config:
            allow:
              - admin
      parameters:
        - name: exportId
          in: path
          required: true
          description: Prefixed export ID.
          schema:
            type: string
            pattern: "^exp_[0-9a-f-]{36}$"
            maxLength: 40
      responses:
        "200":
          description: The zip archive
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/zip:
              schema:
                type: string
                format: binary
                maxLength: 17179869184
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The export is not complete
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Custom Emojis (Admin) ──

  /api/admin/emojis:
    get:
      operationId: listAdminEmojis
      summary: List custom emojis (admin)
      description: >-
        Returns all custom emojis. Requires admin role.
      tags:
        - Admin
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      x-barbacane-middlewares:
        - name: acl
          config:
            allow:
              - admin
      responses:
        "200":
          description: Paginated list of custom emojis
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: "#/components/schemas/CustomEmoji"
                  cursor:
                    type: ["string", "null"]
                    maxLength: 40
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createCustomEmoji
      summary: Upload a custom emoji
      description: >-
        Uploads a custom emoji image with a shortcode. Requires admin role.
        The image must be under 256 KB and have an image/* content type.
      tags:
        - Admin
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      x-barbacane-middlewares:
        - name: acl
          config:
            allow:
              - admin
      requestBody:
        description: The emoji's shortcode and image.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [shortcode, image]
              properties:
                shortcode:
                  type: string
                  minLength: 2
                  maxLength: 32
                  pattern: "^[a-z0-9_]+$"
                  description: Shortcode for the emoji (e.g. "party_parrot").
                image:
                  type: string
                  format: binary
                  maxLength: 262144
                  description: Emoji image file (PNG, GIF, WebP, or SVG, max 256 KB).
      responses:
        "201":
          description: Custom emoji created
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomEmoji"
        "400":
          description: Invalid shortcode or missing image
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Image exceeds 256 KB size limit
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/emojis/{emojiId}:
    delete:
