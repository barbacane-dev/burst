            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/search/messages:
    get:
      operationId: searchMessages
      summary: Full-text search across messages
      description: >-
        Searches message content using PostgreSQL full-text search. Results are
        scoped to channels the caller is a member of. Supports quoted phrases
        and -exclude syntax via websearch_to_tsquery. Returns highlighted
        snippets in the headline field.
      tags:
        - Search
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (supports quoted phrases and -exclude)
          schema:
            type: string
            minLength: 1
            maxLength: 200
            example: "deploy fix"
        - name: channelId
          in: query
          description: Restrict results to a specific channel
          schema:
            type: string
            pattern: "^(ch_)?[0-9a-f-]{36}$"
            maxLength: 39
            example: "ch_0193a5e0-7c1a-7000-8000-000000000010"
        - name: cursor
          in: query
          description: Pagination cursor (opaque token from previous response)
          schema:
            type: string
            pattern: "^msg_[0-9a-f-]{36}$"
            maxLength: 40
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: string
            maxLength: 3
            pattern: "^[1-9][0-9]{0,2}$"
            default: "50"
      responses:
        "200":
          description: Search results
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultList"
        "400":
          description: Invalid or empty search query
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/emojis:
    get:
      operationId: listCustomEmojis
      summary: List custom emojis
      description: >-
        Returns all custom emojis available to the current user (for the emoji picker).
      tags:
        - Reactions
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      responses:
        "200":
          description: Paginated list of custom emojis
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: "#/components/schemas/CustomEmoji"
                  cursor:
                    type: ["string", "null"]
                    maxLength: 40
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/attachments/{attachmentId}:
    get:
      operationId: downloadAttachment
      summary: Download a file attachment
      description: >-
        Returns the raw file content for the given attachment. The caller must
        be a member of the channel that contains the attachment's message.
        Images and PDFs are served inline; other files as downloads.
      tags:
        - Files
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      x-barbacane-middlewares:
        - name: oidc-auth
          config:
            issuer_url: "env://BURST_OIDC_ISSUER_URL"
            issuer_override: "env://BURST_OIDC_ISSUER_OVERRIDE"
            audience: "burst"
            allow_query_token: true
            groups_claim: "env://BURST_OIDC_GROUPS_CLAIM"
        - name: rate-limit
          config:
            quota: 300
            window: 60
            partition_key: "context:auth.sub"
      parameters:
        - name: attachmentId
          in: path
          required: true
          description: Attachment ID (prefixed or raw UUID)
          schema:
            type: string
            pattern: "^(att_)?[0-9a-f-]{36}$"
            maxLength: 40
            example: "att_0193a5e0-7c1a-7000-8000-000000000200"
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                maxLength: 10485760
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Attachment not found or caller is not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

        "429":
          $ref: "#/components/responses/RateLimited"
