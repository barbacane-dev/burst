openapi: 3.2.0
info:
  title: Burst API
  version: 0.1.0
  description: >-
    Burst team messaging API. This spec is the single source of truth for both
    the API contract and the Barbacane gateway configuration (ADR-005, ADR-006).
  contact:
    name: Barbacane
    url: https://github.com/barbacane-dev/burst
  license:
    name: AGPL-3.0-only

servers:
  - url: https://localhost:8080
    description: Barbacane gateway (local dev)

# ── Barbacane gateway configuration ──

x-barbacane-middlewares:
  - name: oidc-auth
    config:
      issuer_url: "http://127.0.0.1:9099/burst"
      issuer_override: "http://localhost:9099/burst"
      audience: "burst"
      allow_query_token: true
      groups_claim: "roles"
  - name: rate-limit
    config:
      quota: 100
      window: 60
      partition_key: "context:auth.sub"

# ── Tags ──

tags:
  - name: Realtime
    description: WebSocket real-time messaging
  - name: Users
    description: User profile management
  - name: Channels
    description: Channel management and membership
  - name: Messages
    description: Messaging within channels
  - name: Reactions
    description: Emoji reactions on messages
  - name: Search
    description: Full-text message search
  - name: Files
    description: File attachments
  - name: Storage
    description: S3-compatible object storage (gateway-only, via Barbacane S3 dispatcher)
  - name: Pins
    description: Pinned messages
  - name: Admin
    description: Administration endpoints (admin role required)

# ── Paths ──

paths:
  /ws:
    get:
      operationId: websocket
      summary: WebSocket real-time connection
      description: >-
        Upgrades to a WebSocket connection for real-time events. Authentication
        is handled by Barbacane on the HTTP Upgrade request. The optional
        lastEventId query parameter enables gap-fill on reconnect.
      tags:
        - Realtime
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: ws-upstream
        config:
          url: "ws://127.0.0.1:3000"
      parameters:
        - name: lastEventId
          in: query
          description: >-
            ID of the last event received by the client. If provided, the server
            will replay missed events after the WebSocket connection is established.
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "101":
          description: Switching Protocols — WebSocket upgrade successful
        "401":
          $ref: "#/components/responses/Unauthorized"

        "429":
          $ref: "#/components/responses/RateLimited"
  /users:
    get:
      operationId: listUsers
      summary: List users
      description: Returns a paginated list of users ordered by creation time.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
      parameters:
        - name: cursor
          in: query
          description: Pagination cursor (opaque token from previous response)
          schema:
            type: string
            pattern: "^ch_[0-9a-f-]{36}$"
            maxLength: 39
            example: "ch_0193a5e0-7c1a-7000-8000-000000000001"
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: string
            maxLength: 3
            pattern: "^[1-9][0-9]{0,2}$"
            default: "50"
            example: "50"
      responses:
        "200":
          description: Paginated user list
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          description: Invalid query parameters
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/me:
    get:
      operationId: getMe
      summary: Get current user
      description: Returns the profile of the currently authenticated user.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
      responses:
        "200":
          description: Current user profile
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "usr_0193a5e0-7c1a-7000-8000-000000000001"
                username: "alice"
                displayName: "Alice Martin"
                email: "alice@example.com"
                role: "member"
                status: "online"
                isBot: false
                createdAt: "2026-03-06T10:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{userId}:
    get:
      operationId: getUser
      summary: Get a user by ID
      description: Returns the public profile of a specific user.
      tags:
        - Users
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/users/{userId}"
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID (prefixed with usr_ or raw UUID)
          schema:
            type: string
            pattern: "^(usr_)?[0-9a-f-]{36}$"
            maxLength: 40
            example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
      responses:
        "200":
          description: User profile
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid user ID format
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /channels:
    get:
      operationId: listChannels
      summary: List channels
      description: >-
        Returns a paginated list of channels.

        - `?joined=true` — channels the authenticated user is a member of,
          with per-channel `unreadCount`. Use this for the sidebar.
        - `?joined=false` (default) — all public channels, for discovery.
          `unreadCount` is always `0` in this mode.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
      parameters:
        - name: joined
          in: query
          description: When true, restrict results to channels the caller has joined.
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
        - name: cursor
          in: query
          description: Pagination cursor (opaque token from previous response)
          schema:
            type: string
            maxLength: 40
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: string
            maxLength: 3
            pattern: "^[1-9][0-9]{0,2}$"
            default: "50"
      responses:
        "200":
          description: Paginated channel list
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/Channel"
                  cursor:
                    type: string
                    maxLength: 40
                    description: Cursor for next page, absent if no more results.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createChannel
      summary: Create a channel
      description: Creates a new public or private channel. The creator is automatically added as owner.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
      requestBody:
        description: Channel to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
            example:
              name: "engineering"
              slug: "engineering"
              kind: "public"
              topic: "Engineering discussions"
      responses:
        "201":
          description: Channel created
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Channel slug already exists
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /channels/{channelId}:
    get:
      operationId: getChannel
      summary: Get a channel
      description: Returns a channel by ID. Private channels require membership.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Channel details
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          description: Invalid channel ID format
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ChannelNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateChannel
      summary: Update a channel
      description: Updates channel name, topic, or description. Requires membership.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        description: Fields to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: Channel updated
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "404":
          $ref: "#/components/responses/ChannelNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /dms:
    post:
      operationId: createOrGetDm
      summary: Create or retrieve a direct message channel
      description: Returns an existing DM channel with the given user, or creates one if it does not exist.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
      requestBody:
        description: Target user for the DM
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDmRequest"
      responses:
        "200":
          description: DM channel (existing or newly created)
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Target user not found
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /channels/{channelId}/members:
    get:
      operationId: listChannelMembers
      summary: List channel members
      description: Returns members of a channel. Requires membership.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/members"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Channel member list
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelMemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: joinChannel
      summary: Join a channel
      description: Adds the current user to a public channel.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/members"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: Joined successfully
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Cannot join non-public channel
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          $ref: "#/components/responses/ChannelNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /channels/{channelId}/members/me:
    delete:
      operationId: leaveChannel
      summary: Leave a channel
      description: Removes the current user from the channel.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/members/me"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: Left successfully
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /channels/{channelId}/members/me/last-read:
    patch:
      operationId: markChannelRead
      summary: Mark the channel as read
      description: Updates the caller's last-read timestamp for this channel, resetting the unread count.
      tags:
        - Channels
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/members/me/last-read"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: Last-read timestamp updated
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "404":
          $ref: "#/components/responses/ChannelNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /channels/{channelId}/messages:
    get:
      operationId: listMessages
      summary: List messages in a channel
      description: Returns messages in a channel ordered by newest first (cursor-based pagination with UUIDv7).
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/messages"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - name: cursor
          in: query
          description: Pagination cursor (message ID; returns messages older than this)
          schema:
            type: string
            pattern: "^msg_[0-9a-f-]{36}$"
            maxLength: 40
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: string
            maxLength: 3
            pattern: "^[1-9][0-9]{0,2}$"
            default: "50"
      responses:
        "200":
          description: Paginated message list
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: sendMessage
      summary: Send a message
      description: Sends a new message to a channel. Requires membership.
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/messages"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        description: >-
          Send as JSON for text-only messages, or multipart/form-data to
          include file attachments.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            example:
              content: "Hello, world!"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SendMessageMultipart"
      responses:
        "201":
          description: Message sent
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /channels/{channelId}/messages/{messageId}:
    get:
      operationId: getMessage
      summary: Get a message
      description: Returns a specific message by ID. Requires channel membership.
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/messages/{messageId}"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Message details
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "404":
          $ref: "#/components/responses/MessageNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: editMessage
      summary: Edit a message
      description: Edits a message's content. Only the author can edit their own messages.
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/messages/{messageId}"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        description: Updated message content
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMessageRequest"
      responses:
        "200":
          description: Message edited
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "404":
          $ref: "#/components/responses/MessageNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteMessage
      summary: Delete a message
      description: Soft-deletes a message (content cleared, row preserved). Only the author can delete.
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/messages/{messageId}"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Message deleted
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "404":
          $ref: "#/components/responses/MessageNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /channels/{channelId}/messages/{messageId}/replies:
    get:
      operationId: listThreadReplies
      summary: List replies in a message thread
      description: Returns replies to a thread root message, ordered by oldest first.
      tags:
        - Messages
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/messages/{messageId}/replies"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
        - name: cursor
          in: query
          description: Pagination cursor (message ID)
          schema:
            type: string
            maxLength: 40
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: string
            maxLength: 3
            pattern: "^[1-9][0-9]{0,2}$"
            default: "50"
      responses:
        "200":
          description: Paginated thread reply list
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "404":
          $ref: "#/components/responses/MessageNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /channels/{channelId}/messages/{messageId}/reactions/{emoji}:
    put:
      operationId: addReaction
      summary: Add a reaction to a message (idempotent)
      description: Adds an emoji reaction from the current user. Has no effect if already reacted.
      tags:
        - Reactions
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/messages/{messageId}/reactions/{emoji}"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
        - name: emoji
          in: path
          required: true
          description: Emoji character or shortcode
          schema:
            type: string
            maxLength: 64
            example: "👍"
      responses:
        "204":
          description: Reaction added
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "404":
          $ref: "#/components/responses/MessageNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeReaction
      summary: Remove a reaction from a message
      description: Removes the current user's emoji reaction from a message.
      tags:
        - Reactions
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/channels/{channelId}/messages/{messageId}/reactions/{emoji}"
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/MessageId"
        - name: emoji
          in: path
          required: true
          description: Emoji character or shortcode
          schema:
            type: string
            maxLength: 64
            example: "👍"
      responses:
        "204":
          description: Reaction removed
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotChannelMember"
        "404":
          description: Message or reaction not found
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /search/messages:
    get:
      operationId: searchMessages
      summary: Full-text search across messages
      description: >-
        Searches message content using PostgreSQL full-text search. Results are
        scoped to channels the caller is a member of. Supports quoted phrases
        and -exclude syntax via websearch_to_tsquery. Returns highlighted
        snippets in the headline field.
      tags:
        - Search
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/search/messages"
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (supports quoted phrases and -exclude)
          schema:
            type: string
            minLength: 1
            maxLength: 200
            example: "deploy fix"
        - name: channelId
          in: query
          description: Restrict results to a specific channel
          schema:
            type: string
            pattern: "^(ch_)?[0-9a-f-]{36}$"
            maxLength: 39
            example: "ch_0193a5e0-7c1a-7000-8000-000000000010"
        - name: cursor
          in: query
          description: Pagination cursor (opaque token from previous response)
          schema:
            type: string
            pattern: "^msg_[0-9a-f-]{36}$"
            maxLength: 40
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: string
            maxLength: 3
            pattern: "^[1-9][0-9]{0,2}$"
            default: "50"
      responses:
        "200":
          description: Search results
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultList"
        "400":
          description: Invalid or empty search query
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /attachments/{attachmentId}:
    get:
      operationId: downloadAttachment
      summary: Download a file attachment
      description: >-
        Returns the raw file content for the given attachment. The caller must
        be a member of the channel that contains the attachment's message.
        Images and PDFs are served inline; other files as downloads.
      tags:
        - Files
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
          path: "/attachments/{attachmentId}"
      parameters:
        - name: attachmentId
          in: path
          required: true
          description: Attachment ID (prefixed or raw UUID)
          schema:
            type: string
            pattern: "^(att_)?[0-9a-f-]{36}$"
            maxLength: 40
            example: "att_0193a5e0-7c1a-7000-8000-000000000200"
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                maxLength: 10485760
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Attachment not found or caller is not a channel member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

        "429":
          $ref: "#/components/responses/RateLimited"
  # ── Pinned messages ──

  /channels/{channelId}/messages/{messageId}/pin:
    put:
      operationId: pinMessage
      summary: Pin a message
      description: Pins a message in the channel. Requires channel membership.
      tags:
        - Pins
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
