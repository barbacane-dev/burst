          description: Maximum number of items to return per page.
          schema:
            type: string
            maxLength: 3
            default: "50"
      responses:
        "200":
          description: Paginated admin user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden — admin role required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

        "429":
          $ref: "#/components/responses/RateLimited"
  /admin/users/{userId}:
    patch:
      operationId: updateAdminUser
      summary: Update a user (admin)
      description: >-
        Updates user role or deactivation status. All changes are audit-logged.
      tags:
        - Admin
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "http://127.0.0.1:3000"
      x-barbacane-middlewares:
        - name: acl
          config:
            allow:
              - admin
      parameters:
        - name: userId
          in: path
          required: true
          description: The user's unique identifier.
          schema:
            type: string
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [admin, moderator, member, guest]
                deactivated:
                  type: boolean
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

        "429":
          $ref: "#/components/responses/RateLimited"
  /admin/channels:
    get:
      operationId: listAdminChannels
      summary: List all channels (admin)
