  /api/search/messages:
    get:
      operationId: searchMessages
      summary: Full-text search across messages
      description: >-
        Searches message content, matching word stems ("running" finds "run"),
        and the names of the files attached to messages. Results are scoped to
        channels the caller is a member of. The query accepts "quoted phrases"
        and -excluded words. Matching terms are highlighted in the `headline`
        field. File names match by case-insensitive substring, and a result
        found that way names the file in `matchedFile`. Results are ordered by
        relevance; `cursor` continues exactly where the previous page ended.
      tags:
        - Search
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (supports quoted phrases and -exclude)
          schema:
            type: string
            minLength: 1
            maxLength: 200
            example: "deploy fix"
        - name: channelId
          in: query
          description: Restrict results to a specific channel
          schema:
            type: string
            pattern: "^(ch_)?[0-9a-f-]{36}$"
            maxLength: 39
            example: "ch_0193a5e0-7c1a-7000-8000-000000000010"
        - name: from
          in: query
          description: Only messages written by this user
          schema:
            type: string
            pattern: "^(usr_)?[0-9a-f-]{36}$"
            maxLength: 40
            example: "usr_0193a5e0-7c1a-7000-8000-000000000001"
        - name: after
          in: query
          description: Only messages sent at or after this instant (RFC 3339)
          schema:
            type: string
            format: date-time
            maxLength: 40
            example: "2026-09-01T00:00:00+02:00"
        - name: before
          in: query
          description: >-
            Only messages sent before this instant (RFC 3339). Must be later
            than `after` when both are given.
          schema:
            type: string
            format: date-time
            maxLength: 40
            example: "2026-10-01T00:00:00+02:00"
        - name: hasFile
          in: query
          description: Only messages carrying at least one file
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: cursor
          in: query
          description: Pagination cursor (opaque token from the previous response)
          schema:
            type: string
            pattern: "^[0-9.]+_[0-9a-f-]{36}$"
            maxLength: 64
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: string
            maxLength: 3
            pattern: "^[1-9][0-9]{0,2}$"
            default: "50"
      responses:
        "200":
          description: Search results
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultList"
        "400":
          description: Invalid or empty search query
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/emojis:
    get:
      operationId: listCustomEmojis
      summary: List custom emojis
      description: >-
        Returns all custom emojis available to the current user (for the emoji picker).
      tags:
        - Reactions
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      responses:
        "200":
          description: Paginated list of custom emojis
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: "#/components/schemas/CustomEmoji"
                  cursor:
                    type: ["string", "null"]
                    maxLength: 40
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/emojis/{emojiId}/image:
    get:
      operationId: getCustomEmojiImage
      summary: Custom emoji image
      description: >-
        Returns the image of a custom emoji, for any signed-in user. This is the
        `imageUrl` a CustomEmoji carries. An `<img>` cannot send a bearer
        header, so the token may come as the `access_token` query parameter.
      tags:
        - Reactions
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      x-barbacane-middlewares:
        - name: oidc-auth
          config:
            issuer_url: "env://BURST_OIDC_ISSUER_URL"
            issuer_override: "env://BURST_OIDC_ISSUER_OVERRIDE"
            audience: "burst"
            allow_query_token: true
            groups_claim: "env://BURST_OIDC_GROUPS_CLAIM"
        - name: rate-limit
          config:
            quota: 300
            window: 60
            partition_key: "context:auth.sub"
      parameters:
        - name: emojiId
          in: path
          required: true
          description: Custom emoji ID (UUID)
          schema:
            type: string
            pattern: "^[0-9a-f-]{36}$"
            maxLength: 36
            example: "0193a5e0-7c1a-7000-8000-000000000300"
      responses:
        "200":
          description: The emoji image
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            image/*:
              schema:
                type: string
                format: binary
                maxLength: 262144
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No custom emoji has this ID
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/attachments/{attachmentId}:
    get:
      operationId: downloadAttachment
      summary: Download a file attachment
      description: >-
        Returns the raw file content for the given attachment. The caller must
        be a member of the channel that contains the attachment's message.
        Images and PDFs are served inline; other files as downloads.
      tags:
        - Files
      security:
        - BearerAuth: []
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BURST_UPSTREAM_URL"
      x-barbacane-middlewares:
        - name: oidc-auth
          config:
            issuer_url: "env://BURST_OIDC_ISSUER_URL"
            issuer_override: "env://BURST_OIDC_ISSUER_OVERRIDE"
            audience: "burst"
            allow_query_token: true
            groups_claim: "env://BURST_OIDC_GROUPS_CLAIM"
        - name: rate-limit
          config:
            quota: 300
            window: 60
            partition_key: "context:auth.sub"
      parameters:
        - name: attachmentId
          in: path
          required: true
          description: Attachment ID (prefixed or raw UUID)
          schema:
            type: string
            pattern: "^(att_)?[0-9a-f-]{36}$"
            maxLength: 40
            example: "att_0193a5e0-7c1a-7000-8000-000000000200"
      responses:
        "200":
          description: File content
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                maxLength: 10485760
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Attachment not found or caller is not a channel member
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Policy:
              $ref: "#/components/headers/X-RateLimit-Policy"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

        "429":
          $ref: "#/components/responses/RateLimited"
