# Dev-only services for local Burst development.
# Start with: docker compose -f docker-compose.dev.yml up

services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: burst
      POSTGRES_PASSWORD: burst
      POSTGRES_DB: burst
    volumes:
      - pgdata:/var/lib/postgresql/data

  mock-oauth:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "9099:8080"
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: >
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "burst",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "username",
                  "match": "alice",
                  "claims": {
                    "aud": "burst",
                    "roles": ["admin"]
                  }
                },
                {
                  "requestParam": "username",
                  "match": "ivy",
                  "claims": {
                    "sub": "ivy@burst.local",
                    "preferred_username": "ivy",
                    "name": "Ivy Integrator",
                    "email": "ivy@burst.local",
                    "aud": "burst",
                    "roles": ["integrator"]
                  }
                },
                {
                  "requestParam": "grant_type",
                  "match": "password",
                  "claims": {
                    "aud": "burst",
                    "roles": ["member"]
                  }
                },
                {
                  "requestParam": "grant_type",
                  "match": "authorization_code",
                  "claims": {
                    "sub": "oidc-user@burst.local",
                    "aud": "burst",
                    "roles": ["member"]
                  }
                }
              ]
            }
          ]
        }

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ROOT_USER: burst
      RUSTFS_ROOT_PASSWORD: burstpass
    command: server /data --console-address ":9001"
    volumes:
      - rustfsdata:/data

volumes:
  pgdata:
  rustfsdata:
