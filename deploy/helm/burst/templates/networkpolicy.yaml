{{- if .Values.networkPolicy.enabled }}
{{- $server := dict "root" . "component" "server" }}
{{- $gateway := dict "root" . "component" "gateway" }}
{{- $metrics := .Values.networkPolicy.metricsNamespaceSelector }}
# The server believes the identity headers it receives, so only the gateway may
# reach its API port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "burst.componentName" $server }}
  labels:
    {{- include "burst.componentLabels" $server | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "burst.selectorLabels" $server | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "burst.selectorLabels" $gateway | nindent 14 }}
      ports:
        - port: 3000
    {{- if $metrics }}
    - from:
        - namespaceSelector:
            {{- toYaml $metrics | nindent 12 }}
      ports:
        - port: 3001
    {{- end }}
{{- if eq .Values.storage.backend "s3" }}
{{- $storage := dict "root" . "component" "storage" }}
---
# The storage gateway holds the bucket credentials; only the server uses it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "burst.componentName" $storage }}
  labels:
    {{- include "burst.componentLabels" $storage | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "burst.selectorLabels" $storage | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "burst.selectorLabels" $server | nindent 14 }}
      ports:
        - port: 8081
    {{- if $metrics }}
    - from:
        - namespaceSelector:
            {{- toYaml $metrics | nindent 12 }}
      ports:
        - port: 8090
    {{- end }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.database.existingSecret) }}
{{- $pg := dict "root" . "component" "postgresql" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "burst.componentName" $pg }}
  labels:
    {{- include "burst.componentLabels" $pg | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "burst.selectorLabels" $pg | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "burst.selectorLabels" $server | nindent 14 }}
      ports:
        - port: 5432
{{- end }}
{{- end }}
