{{- include "burst.validate" . }}
{{- /* Generated values are read back from this Secret on upgrade, so they stay stable. */}}
{{- $password := include "burst.postgresPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "burst.secretName" . }}
  labels:
    {{- include "burst.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.storageApiKey.existingSecret }}
  storage-api-key: {{ default (include "burst.keptSecret" (dict "root" . "key" "storage-api-key")) .Values.storageApiKey.value | quote }}
  {{- end }}
  {{- if and .Values.postgresql.enabled (not .Values.database.existingSecret) }}
  postgres-password: {{ $password | quote }}
  {{- end }}
