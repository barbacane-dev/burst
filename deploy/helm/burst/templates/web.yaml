{{- $name := include "burst.componentName" (dict "root" . "component" "web") }}
{{- $ctx := dict "root" . "component" "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "burst.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "burst.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "burst.componentLabels" $ctx | nindent 8 }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "burst.image" (dict "root" . "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- include "burst.lifecycle" . | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          env:
            # nginx proxies /api and /ws here when reached directly, as with a
            # port-forward; through the route, those paths go to the gateway.
            - name: BURST_GATEWAY_UPSTREAM
              value: {{ printf "%s:8080" (include "burst.componentName" (dict "root" . "component" "gateway")) | quote }}
            # The browser signs in at the public issuer: issuerUrl may be an
            # in-cluster address only the gateway can reach.
            - name: OIDC_AUTHORITY
              value: {{ default .Values.oidc.issuerUrl .Values.oidc.issuerOverride | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ include "burst.redirectUri" . | quote }}
            - name: OIDC_SCOPE
              value: {{ .Values.oidc.scope | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "burst.componentLabels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "burst.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
