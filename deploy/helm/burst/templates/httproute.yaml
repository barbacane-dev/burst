{{- if .Values.httpRoute.enabled }}
{{- $gateway := include "burst.componentName" (dict "root" . "component" "gateway") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "burst.fullname" . }}
  labels:
    {{- include "burst.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # The API and the WebSocket go to the gateway, which authenticates them.
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: {{ $gateway }}
          port: 8080
    # Everything else is the SPA.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "burst.componentName" (dict "root" . "component" "web") }}
          port: 8080
{{- end }}
