suite: generated secrets
templates:
  - templates/secret.yaml
release:
  name: chat
set:
  oidc.issuerUrl: https://id.example
  postgresql.enabled: true
  httpRoute.enabled: false
tests:
  - it: generates the bundled database's password
    asserts:
      - matchRegex:
          path: stringData.postgres-password
          pattern: ^[A-Za-z0-9]{40}$

  - it: uses a password that was set
    set:
      postgresql.password: s3cret
    asserts:
      - equal:
          path: stringData.postgres-password
          value: s3cret

  - it: holds no database password when an external database is used
    set:
      postgresql.enabled: false
      database.existingSecret: db
    asserts:
      - notExists:
          path: stringData.postgres-password

  - it: generates the storage key unless one is provided
    asserts:
      - matchRegex:
          path: stringData.storage-api-key
          pattern: ^[A-Za-z0-9]{40}$
  - it: leaves the storage key to an existing Secret
    set:
      storageApiKey.existingSecret: keys
    asserts:
      - notExists:
          path: stringData.storage-api-key
