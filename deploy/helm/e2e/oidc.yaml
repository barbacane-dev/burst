# A mock OIDC provider issuing the tokens the smoke test asks for, as in
# docker-compose.dev.yml: alice is an admin, ivy an integrator, everyone else
# a member.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oauth
  namespace: burst
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock-oauth}
  template:
    metadata:
      labels: {app: mock-oauth}
    spec:
      containers:
        - name: mock-oauth
          image: ghcr.io/navikt/mock-oauth2-server:2.1.10
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: JSON_CONFIG
              value: |
                {
                  "interactiveLogin": false,
                  "tokenCallbacks": [{
                    "issuerId": "burst",
                    "tokenExpiry": 3600,
                    "requestMappings": [
                      {"requestParam": "username", "match": "alice",
                       "claims": {"aud": "burst", "roles": ["admin"]}},
                      {"requestParam": "username", "match": "ivy",
                       "claims": {"sub": "ivy@burst.local", "preferred_username": "ivy",
                                  "name": "Ivy Integrator", "email": "ivy@burst.local",
                                  "aud": "burst", "roles": ["integrator"]}},
                      {"requestParam": "grant_type", "match": "password",
                       "claims": {"aud": "burst", "roles": ["member"]}}
                    ]
                  }]
                }
          readinessProbe:
            httpGet:
              path: /burst/.well-known/openid-configuration
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mock-oauth
  namespace: burst
spec:
  selector: {app: mock-oauth}
  ports:
    - port: 8080
      targetPort: 8080
