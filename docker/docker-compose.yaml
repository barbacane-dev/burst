services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: burst
      POSTGRES_PASSWORD: burst
      POSTGRES_DB: burst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burst"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
