# Full-stack Burst deployment — zero-trust topology (ADR-009).
#
# Prerequisites:
#   make gateway-compile    # Produces burst-api.bca
#
# Usage:
#   docker compose -f docker/docker-compose.yaml up --build
#
# Architecture (zero trust):
#   Browser → Barbacane (:8080) → Burst (internal only)
#                                    ↓
#                              Barbacane S3 dispatcher → RustFS (internal only)
#                                    ↓
#                              PostgreSQL (internal only)
#
# Only Barbacane (8080) and Burst admin (3001) are exposed to the host.
# Burst API (3000) is internal — all traffic goes through the gateway.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: burst
      POSTGRES_PASSWORD: burst
      POSTGRES_DB: burst
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burst"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ROOT_USER: burst
      RUSTFS_ROOT_PASSWORD: burstpass
    command: server /data --console-address ":9001"
    volumes:
      - rustfsdata:/data

  burst:
    build:
      context: ..
      dockerfile: Dockerfile
    expose:
      - "3000"
    ports:
      - "3001:3001"
    environment:
      BURST_DATABASE_URL: postgres://burst:burst@postgres:5432/burst
      BURST_SERVER_LISTEN: "0.0.0.0:3000"
      BURST_SERVER_ADMIN_LISTEN: "0.0.0.0:3001"
      BURST_STORAGE_LOCAL_PATH: /var/lib/burst/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  barbacane:
    image: ghcr.io/barbacane-dev/barbacane-standalone
    ports:
      - "8080:8080"
    volumes:
      - ../burst-api.bca:/config/burst-api.bca:ro
    environment:
      # Upstream URLs (Docker service names instead of localhost)
      BURST_UPSTREAM_URL: http://burst:3000
      BURST_UPSTREAM_WS_URL: ws://burst:3000
      # OIDC — requires an OIDC provider (not included in this compose)
      # Override these for your identity provider:
      BURST_OIDC_ISSUER_URL: ${BURST_OIDC_ISSUER_URL:-http://host.docker.internal:9099/burst}
      BURST_OIDC_ISSUER_OVERRIDE: ${BURST_OIDC_ISSUER_OVERRIDE:-http://localhost:9099/burst}
      # S3 dispatcher → RustFS
      BURST_S3_REGION: us-east-1
      BURST_S3_BUCKET: burst-files
      BURST_S3_ACCESS_KEY_ID: burst
      BURST_S3_SECRET_ACCESS_KEY: burstpass
      BURST_S3_ENDPOINT: http://rustfs:9000
    command: >
      serve
      --artifact /config/burst-api.bca
      --listen 0.0.0.0:8080
      --dev
      --allow-plaintext-upstream
      --max-body-size 10485760
    depends_on:
      burst:
        condition: service_healthy

volumes:
  pgdata:
  rustfsdata:
