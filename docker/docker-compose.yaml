# Full-stack Burst deployment — zero-trust topology (ADR-009).
#
# Prerequisites:
#   make gateway-compile    # Produces burst-api.bca + burst-s3.bca
#
# Usage:
#   docker compose -f docker/docker-compose.yaml up --build
#
# Architecture (zero trust):
#   Browser → nginx (:8080) ─┬─ SPA static files (served directly)
#                             ├─ /api/* → Barbacane (internal) → Burst → PostgreSQL
#                             └─ /ws   → Barbacane (internal) → Burst
#                                            ↓
#                                      Barbacane-S3 (:8081, internal) → RustFS
#
# Only nginx (8080) and Burst admin (3001) are exposed to the host.
# Two Barbacane instances: public gateway (full middleware) + S3 sidecar (minimal).

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: burst
      POSTGRES_PASSWORD: burst
      POSTGRES_DB: burst
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burst"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ROOT_USER: burst
      RUSTFS_ROOT_PASSWORD: burstpass
    command: server /data --console-address ":9001"
    volumes:
      - rustfsdata:/data

  burst:
    build:
      context: ..
      dockerfile: Dockerfile
    expose:
      - "3000"
    ports:
      - "3001:3001"
    environment:
      BURST_DATABASE_URL: postgres://burst:burst@postgres:5432/burst
      BURST_SERVER_LISTEN: "0.0.0.0:3000"
      BURST_SERVER_ADMIN_LISTEN: "0.0.0.0:3001"
      BURST_STORAGE_BACKEND: gateway
      BURST_STORAGE_GATEWAY_URL: http://barbacane-s3:8081
      BURST_STORAGE_GATEWAY_API_KEY: burst-s3-internal-key
      BURST_STORAGE_LOCAL_PATH: /var/lib/burst/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Public gateway — handles API + WebSocket traffic with full middleware stack
  # Plugins: oidc-auth, acl, rate-limit, http-upstream, ws-upstream
  barbacane:
    image: ghcr.io/barbacane-dev/barbacane-standalone:0.5.1
    expose:
      - "8080"
    volumes:
      - ../burst-api.bca:/config/burst-api.bca:ro
    environment:
      BURST_UPSTREAM_URL: http://burst:3000
      BURST_UPSTREAM_WS_URL: ws://burst:3000
      BURST_OIDC_ISSUER_URL: ${BURST_OIDC_ISSUER_URL:-http://host.docker.internal:9099/burst}
      BURST_OIDC_ISSUER_OVERRIDE: ${BURST_OIDC_ISSUER_OVERRIDE:-http://localhost:9099/burst}
    command: >
      serve
      --artifact /config/burst-api.bca
      --listen 0.0.0.0:8080
      --dev
      --allow-plaintext-upstream
      --max-body-size 10485760
    depends_on:
      burst:
        condition: service_healthy

  # nginx — serves SPA static files, proxies /api and /ws to Barbacane
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    ports:
      - "8080:8080"
    depends_on:
      - barbacane

  # S3 storage sidecar — internal only, minimal attack surface
  # Plugins: s3, apikey-auth
  barbacane-s3:
    image: ghcr.io/barbacane-dev/barbacane-standalone:0.5.1
    expose:
      - "8081"
    volumes:
      - ../burst-s3.bca:/config/burst-s3.bca:ro
    environment:
      BURST_S3_REGION: us-east-1
      BURST_S3_BUCKET: burst-files
      BURST_S3_ACCESS_KEY_ID: burst
      BURST_S3_SECRET_ACCESS_KEY: burstpass
      BURST_S3_ENDPOINT: http://rustfs:9000
      BURST_S3_API_KEY: burst-s3-internal-key
    command: >
      serve
      --artifact /config/burst-s3.bca
      --listen 0.0.0.0:8081
      --dev
      --allow-plaintext-upstream
      --max-body-size 104857600

volumes:
  pgdata:
  rustfsdata:
