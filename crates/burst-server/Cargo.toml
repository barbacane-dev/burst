reqwest.workspace = true
tempfile = "3"
# Sending a real SIGTERM in the process-lifecycle test.
libc = "0.2"
# A real WebSocket client, for tests of what a connected socket receives.
# Both are already in the tree through axum.
tokio-tungstenite = "0.29"
futures-util = "0.3"
# Checking values against the patterns the spec declares, which the gateway enforces.
regex = "1"
