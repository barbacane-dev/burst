[book]
title = "Burst Documentation"
description = "Documentation for Burst, open-source team messaging built on Barbacane"
authors = ["Barbacane Contributors"]
language = "en"
src = "docs"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/barbacane-dev/burst"
edit-url-template = "https://github.com/barbacane-dev/burst/edit/main/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30

[output.html.playground]
runnable = false
